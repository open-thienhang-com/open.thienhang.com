<div class="flex min-h-screen flex-col bg-neo-bg">
  <header class="sticky top-0 z-50 border-b-4 border-black bg-neo-bg">
    <div class="mx-auto flex h-20 max-w-7xl items-center justify-between px-6">
      <a routerLink="/" class="flex items-center gap-3">
        <span
          class="flex h-11 w-11 -rotate-3 items-center justify-center border-4 border-black bg-neo-accent text-xl font-black text-black shadow-neo-sm"
        >✦</span>
        <span class="text-xl font-black uppercase tracking-tighter">Travel<span class="text-neo-accent">.</span>Thienhang</span>
      </a>

      <nav class="hidden items-center gap-3 sm:flex">
        <a
          routerLink="/"
          routerLinkActive="bg-black text-white shadow-neo-sm translate-x-0"
          [routerLinkActiveOptions]="{ exact: true }"
          class="border-4 border-black px-4 py-2 text-sm font-bold uppercase tracking-widest transition-all duration-100 ease-out hover:-translate-y-0.5 hover:bg-neo-secondary hover:shadow-neo-sm"
        >Trang chủ</a>
        <a
          routerLink="/journeys"
          routerLinkActive="bg-black text-white shadow-neo-sm"
          class="border-4 border-black px-4 py-2 text-sm font-bold uppercase tracking-widest transition-all duration-100 ease-out hover:-translate-y-0.5 hover:bg-neo-secondary hover:shadow-neo-sm"
        >Hành trình</a>
      </nav>

      <a
        routerLink="/journeys"
        class="border-4 border-black bg-black px-4 py-2 text-xs font-bold uppercase tracking-widest text-white shadow-neo-sm transition-all duration-100 ease-out hover:bg-neo-accent active:translate-x-[2px] active:translate-y-[2px] active:shadow-none sm:hidden"
      >Xem</a>
    </div>
  </header>

  <main class="flex-1">
    <router-outlet></router-outlet>
  </main>

  <footer class="border-t-4 border-black bg-neo-secondary">
    <div class="mx-auto flex max-w-7xl flex-col items-start justify-between gap-4 px-6 py-10 sm:flex-row sm:items-center">
      <div>
        <p class="text-lg font-black uppercase tracking-tighter">Travel.Thienhang</p>
        <p class="mt-1 text-sm font-bold">Nhật ký những hành trình đã đi qua.</p>
      </div>
      <p class="border-2 border-black bg-neo-bg px-3 py-1 text-xs font-bold uppercase tracking-widest shadow-neo-sm">
        © {{ year }} — Built with Angular
      </p>
    </div>
  </footer>
</div>
