<p-toast></p-toast>
<div class="bg-gray-50 min-h-screen">
  <div class="bg-white border-b border-gray-200">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center gap-4">
      <p-button icon="pi pi-arrow-left" [text]="true" [rounded]="true" severity="secondary" (click)="cancel()"></p-button>
      <div class="w-9 h-9 bg-gradient-to-br from-blue-500 to-cyan-600 rounded-xl flex items-center justify-center">
        <i class="pi pi-user text-white"></i>
      </div>
      <h1 class="text-xl font-bold text-gray-900">Create Account</h1>
    </div>
  </div>

  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 space-y-5">

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Full Name <span class="text-red-500">*</span></label>
            <input pInputText formControlName="full_name" placeholder="John Doe" class="w-full" />
            <p *ngIf="invalid('full_name')" class="text-red-500 text-xs mt-1">Full name is required</p>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Username <span class="text-red-500">*</span></label>
            <input pInputText formControlName="username" placeholder="johndoe" class="w-full" />
            <p *ngIf="invalid('username')" class="text-red-500 text-xs mt-1">Username is required</p>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email <span class="text-red-500">*</span></label>
          <input pInputText formControlName="email" type="email" placeholder="john@example.com" class="w-full" />
          <p *ngIf="invalid('email')" class="text-red-500 text-xs mt-1">Valid email is required</p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password <span class="text-red-500">*</span></label>
          <p-password formControlName="password" styleClass="w-full" inputStyleClass="w-full" [feedback]="true" [toggleMask]="true"></p-password>
          <p *ngIf="invalid('password')" class="text-red-500 text-xs mt-1">Password is required</p>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
            <p-dropdown formControlName="type" [options]="typeOptions" optionLabel="label" optionValue="value" styleClass="w-full"></p-dropdown>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Department</label>
            <input pInputText formControlName="department" placeholder="Engineering" class="w-full" />
          </div>
        </div>

        <div class="flex gap-3 pt-2">
          <p-button type="submit" label="Create Account" icon="pi pi-check" [loading]="saving"></p-button>
          <p-button type="button" label="Cancel" severity="secondary" [outlined]="true" (click)="cancel()"></p-button>
        </div>
      </div>
    </form>
  </div>
</div>
