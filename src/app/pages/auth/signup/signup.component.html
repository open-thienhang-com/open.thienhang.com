<div class="auth-form-wrap">

  <!-- Header -->
  <div class="auth-head">
    <div class="auth-head-icon auth-head-icon--green">
      <i class="pi pi-user-plus"></i>
    </div>
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">Join Thienhang — get started in seconds</p>
  </div>

  <!-- Workspace selector -->
  <div class="auth-field">
    <label class="auth-label">
      <i class="pi pi-building"></i> Workspace
    </label>
    <p-dropdown
      [options]="tenants"
      [(ngModel)]="selectedTenant"
      optionLabel="name"
      optionValue="kid"
      placeholder="Select a workspace (optional)"
      [showClear]="true"
      [style]="{'width': '100%'}">
    </p-dropdown>
  </div>

  <!-- Full name -->
  <div class="auth-field">
    <label class="auth-label" for="su-name">
      <i class="pi pi-user"></i> Full name
    </label>
    <input id="su-name" type="text" class="auth-input"
           [(ngModel)]="fullName" name="fullName"
           placeholder="Your full name" autocomplete="name" />
  </div>

  <!-- Email -->
  <div class="auth-field">
    <label class="auth-label" for="su-email">
      <i class="pi pi-envelope"></i> Email address
    </label>
    <input id="su-email" type="email" class="auth-input"
           [(ngModel)]="email" name="email"
           placeholder="you@company.com" autocomplete="email" />
  </div>

  <!-- Password -->
  <div class="auth-field">
    <label class="auth-label" for="su-password">
      <i class="pi pi-key"></i> Password
    </label>
    <p-password inputId="su-password"
                [(ngModel)]="password" name="password"
                placeholder="Min. 8 characters"
                [feedback]="true" [toggleMask]="true"
                styleClass="auth-password"
                inputStyleClass="auth-input"
                autocomplete="new-password">
    </p-password>
  </div>

  <!-- Confirm password -->
  <div class="auth-field">
    <label class="auth-label" for="su-confirm">
      <i class="pi pi-key"></i> Confirm password
    </label>
    <p-password inputId="su-confirm"
                [(ngModel)]="confirmPassword" name="confirmPassword"
                placeholder="Re-enter password"
                [feedback]="false" [toggleMask]="true"
                styleClass="auth-password"
                inputStyleClass="auth-input"
                autocomplete="new-password">
    </p-password>
  </div>

  <!-- Verification channel -->
  <div class="auth-field">
    <label class="auth-label">
      <i class="pi pi-shield"></i> Verify via
    </label>
    <div class="auth-channel-row">
      <div class="auth-channel-opt">
        <p-radioButton name="vchan" value="email" inputId="vchan-email"
                       [(ngModel)]="verificationChannel"></p-radioButton>
        <label for="vchan-email" class="auth-channel-label">
          <i class="pi pi-envelope"></i> Email
        </label>
      </div>
      <div class="auth-channel-opt">
        <p-radioButton name="vchan" value="telegram" inputId="vchan-telegram"
                       [(ngModel)]="verificationChannel"></p-radioButton>
        <label for="vchan-telegram" class="auth-channel-label">
          <i class="pi pi-send"></i> Telegram
        </label>
      </div>
    </div>
  </div>

  <!-- Telegram identifier (only when channel = telegram) -->
  <div *ngIf="verificationChannel === 'telegram'" class="auth-field auth-telegram-hint">
    <label class="auth-label" for="su-tg-chat">
      <i class="pi pi-id-card"></i> Telegram chat ID
    </label>
    <input id="su-tg-chat" type="number" class="auth-input"
           [(ngModel)]="telegramChatId" name="telegramChatId"
           placeholder="123456789" />
    <input type="text" class="auth-input" style="margin-top:.4rem"
           [(ngModel)]="telegramUsername" name="telegramUsername"
           placeholder="&#64;your_telegram_username (optional)" />
    <p class="auth-hint">
      Open <a href="https://t.me/thienhang_bot" target="_blank" rel="noopener" class="auth-link">@thienhang_bot</a>,
      send <code>/start</code>, and copy the chat ID it replies with.
    </p>
  </div>

  <!-- Terms -->
  <div class="auth-check-row">
    <p-checkbox [(ngModel)]="acceptTnC" name="acceptTnC" inputId="acceptTnC" binary="true"></p-checkbox>
    <label for="acceptTnC" class="auth-check-label">
      I agree to the
      <a href="#" class="auth-link">Terms &amp; Conditions</a>
      and
      <a href="#" class="auth-link">Privacy Policy</a>
    </label>
  </div>

  <!-- Submit -->
  <button type="button" class="auth-btn auth-btn--success"
          [class.auth-btn--loading]="isLoading"
          [disabled]="isLoading"
          (click)="signUp()">
    <i *ngIf="!isLoading" class="pi pi-user-plus"></i>
    <i *ngIf="isLoading" class="pi pi-spin pi-spinner"></i>
    {{ isLoading ? 'Creating account…' : 'Create account' }}
  </button>

  <!-- Sign in link -->
  <p class="auth-alt">
    Already have an account?
    <a class="auth-link" (click)="onLogIn.emit()">Sign in</a>
  </p>

</div>

<p-toast></p-toast>
