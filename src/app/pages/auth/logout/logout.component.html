<div class="logout-root">
  <div class="logout-card">

    <div class="logout-icon">
      <i class="pi pi-check"></i>
    </div>

    <h1 class="logout-title">You've been signed out</h1>
    <p class="logout-sub">Your session has been securely ended.</p>

    <p *ngIf="workspaceName" class="logout-workspace">
      Workspace: <strong>{{ workspaceName }}</strong>
    </p>

    <button type="button" class="logout-btn" (click)="goToLogin()">
      <i class="pi pi-sign-in"></i>
      Sign in again
    </button>

    <p class="logout-footer">
      Thienhang · Your session data has been cleared.
    </p>
  </div>
</div>
