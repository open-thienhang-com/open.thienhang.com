<div class="auth-page">
  <div class="animated-background">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
  </div>
  <div class="auth-container">
    <div class="auth-card" style="text-align:center; padding: 3rem 2rem;">
      <div style="width:4rem; height:4rem; background: linear-gradient(135deg, #ef4444, #dc2626); border-radius:50%; display:flex; align-items:center; justify-content:center; margin: 0 auto 1.5rem;">
        <i class="pi pi-sign-out" style="color:white; font-size:1.5rem;"></i>
      </div>
      <h2 style="font-size:1.5rem; font-weight:700; color:#111827; margin-bottom:0.5rem;">Signing you out…</h2>
      <p style="color:#6b7280; margin-bottom:1.5rem;">Please wait while we clear your session.</p>
      <i class="pi pi-spin pi-spinner" style="font-size:2rem; color:#3b82f6;"></i>
    </div>
  </div>
</div>
