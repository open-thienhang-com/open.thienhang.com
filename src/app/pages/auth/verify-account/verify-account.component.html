<div class="p-8">
  <!-- Header -->
  <div class="text-center mb-8">
    <div class="w-16 h-16 bg-gradient-to-r from-emerald-500 to-teal-600 rounded-full flex items-center justify-center mx-auto mb-4">
      <i class="pi pi-envelope text-white text-2xl"></i>
    </div>
    <h1 class="text-3xl font-bold text-gray-900 mb-2">Verify Your Email</h1>
    <p class="text-gray-600">
      We sent a 6-digit OTP to<br>
      <span class="font-semibold text-gray-900">{{ email || 'your email address' }}</span>
    </p>
  </div>

  <!-- OTP Form -->
  <form class="space-y-6">
    <div>
      <label for="otp" class="block text-sm font-medium text-gray-700 mb-2">OTP Code</label>
      <span class="p-input-icon-left w-full">
        <i class="pi pi-key"></i>
        <input
          id="otp"
          type="text"
          pInputText
          [(ngModel)]="otp"
          name="otp"
          placeholder="Enter 6-digit OTP"
          maxlength="6"
          class="w-full text-center text-xl font-mono tracking-widest"
          autocomplete="one-time-code" />
      </span>
    </div>

    <div>
      <p-button
        label="Verify Email"
        icon="pi pi-check-circle"
        severity="success"
        styleClass="w-full"
        size="large"
        (onClick)="verify()"
        [loading]="isLoading">
      </p-button>
    </div>

    <div class="text-center space-y-3">
      <p class="text-sm text-gray-600">
        Didn't receive the OTP?
        <a class="text-emerald-600 hover:text-emerald-500 cursor-pointer font-medium ml-1"
           [class.opacity-50]="resendCooldown > 0"
           [class.cursor-not-allowed]="resendCooldown > 0"
           (click)="resend()">
          Resend OTP{{ resendCooldown > 0 ? ' (' + resendCooldown + 's)' : '' }}
        </a>
      </p>
      <p class="text-sm text-gray-600">
        <a class="text-blue-600 hover:text-blue-500 cursor-pointer font-medium" (click)="onBackToLogin.emit()">
          Back to Sign In
        </a>
      </p>
    </div>
  </form>
</div>

<p-toast></p-toast>
