<div class="p-8">
  <!-- Header -->
  <div class="text-center mb-8">
    <div class="w-16 h-16 bg-gradient-to-r from-orange-500 to-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
      <i class="pi pi-lock text-white text-2xl"></i>
    </div>
    <h1 class="text-3xl font-bold text-gray-900 mb-2">Reset Your Password</h1>
    <p class="text-gray-600">
      Enter the OTP sent to<br>
      <span class="font-semibold text-gray-900">{{ email || 'your email address' }}</span>
    </p>
  </div>

  <!-- Reset Form -->
  <form class="space-y-6">
    <div>
      <label for="resetOtp" class="block text-sm font-medium text-gray-700 mb-2">OTP Code</label>
      <span class="p-input-icon-left w-full">
        <i class="pi pi-key"></i>
        <input
          id="resetOtp"
          type="text"
          pInputText
          [(ngModel)]="otp"
          name="resetOtp"
          placeholder="Enter OTP from email"
          maxlength="6"
          class="w-full text-center text-xl font-mono tracking-widest"
          autocomplete="one-time-code" />
      </span>
    </div>

    <div>
      <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-2">New Password</label>
      <p-password
        id="newPassword"
        [(ngModel)]="password"
        name="newPassword"
        placeholder="Enter new password (min 8 chars)"
        [feedback]="true"
        [toggleMask]="true"
        styleClass="w-full"
        inputStyleClass="w-full"
        autocomplete="new-password">
      </p-password>
    </div>

    <div>
      <label for="confirmNewPassword" class="block text-sm font-medium text-gray-700 mb-2">Confirm New Password</label>
      <p-password
        id="confirmNewPassword"
        [(ngModel)]="confirmPassword"
        name="confirmNewPassword"
        placeholder="Confirm new password"
        [feedback]="false"
        [toggleMask]="true"
        styleClass="w-full"
        inputStyleClass="w-full"
        autocomplete="new-password">
      </p-password>
    </div>

    <div>
      <p-button
        label="Set New Password"
        icon="pi pi-check"
        severity="primary"
        styleClass="w-full"
        size="large"
        (onClick)="resetPassword()"
        [loading]="isLoading">
      </p-button>
    </div>

    <div class="text-center">
      <p class="text-sm text-gray-600">
        <a class="text-blue-600 hover:text-blue-500 cursor-pointer font-medium" (click)="onBackToLogin.emit()">
          Back to Sign In
        </a>
      </p>
    </div>
  </form>
</div>

<p-toast></p-toast>
